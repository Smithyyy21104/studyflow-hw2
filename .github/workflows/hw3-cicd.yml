name: HW3 - Test Build Push Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studyflow-hw3-production
  cancel-in-progress: false

jobs:
  test:
    name: Run FastAPI tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install testing dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  build_and_push:
    name: Build Docker image and push to Docker Hub
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up QEMU for multi-architecture builds
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/studyflow-hw3:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/studyflow-hw3:sha-${{ github.sha }}
          platforms: linux/amd64,linux/arm64

  deploy:
    name: Deploy on self-hosted runner
    needs: build_and_push
    runs-on: [self-hosted, studyflow-deploy]
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Pull image and deploy with health check + rollback
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: sha-${{ github.sha }}
          DEPLOY_VERSION: ${{ github.sha }}
        run: bash scripts/deploy.sh
      - name: Verify deployed service and write summary
        env:
          DEPLOY_VERSION: ${{ github.sha }}
        run: bash scripts/verify.sh
